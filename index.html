<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IPTV">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>مشغّل IPTV</title>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>مشغّل IPTV</h1>
    <div class="actions">
      <button id="btnRefresh" class="ghost" hidden title="تحديث القائمة">تحديث</button>
      <button id="btnInstall" class="ghost" hidden>تثبيت التطبيق</button>
      <button id="btnAdd" class="primary">+ قائمة</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="player" id="player">
        <video id="v" playsinline controls autoplay></video>
        <div id="osd" class="osd" hidden></div>
        <div id="msg" class="msg" hidden></div>
      </div>
      <div class="now">
        <div class="nowtxt">
          <b id="nowName">اختر قناة من القائمة</b>
          <small id="nowGroup"></small>
        </div>
        <button id="btnFav" class="ghost" title="إضافة للمفضلة" disabled>☆</button>
        <button id="btnFs" class="ghost" title="ملء الشاشة">⛶</button>
      </div>
    </section>

    <section class="list">
      <div class="tools">
        <input id="q" type="search" placeholder="ابحث عن قناة…" autocomplete="off">
        <select id="group" aria-label="المجموعة"></select>
      </div>
      <div class="count" id="count"></div>
      <div id="channels" class="channels" role="list"></div>
      <div id="more" aria-hidden="true"></div>
      <div id="empty" class="empty">
        <p><b>لا توجد قائمة بعد.</b></p>
        <p>اضغط «+ قائمة» وأضف رابط M3U أو ارفع ملفاً من جهازك.</p>
        <p id="iosHint" class="hint" hidden>على الآيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog" class="dlgbox" id="dlgForm">
    <h2>إضافة قائمة قنوات</h2>

    <label for="url">رابط قائمة M3U</label>
    <div class="row">
      <input id="url" type="url" inputmode="url" placeholder="https://example.com/list.m3u" dir="ltr">
      <button type="button" id="btnLoadUrl" class="primary">تحميل</button>
    </div>

    <label for="file">أو ملف من الجهاز</label>
    <input id="file" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl">

    <label for="paste">أو الصق المحتوى</label>
    <textarea id="paste" rows="4" dir="ltr" placeholder="#EXTM3U&#10;#EXTINF:-1,Channel&#10;https://…"></textarea>
    <button type="button" id="btnLoadPaste" class="ghost">تحميل المحتوى الملصوق</button>

    <p id="status" class="status" hidden></p>

    <div class="row end">
      <button type="button" id="btnDemo" class="ghost">قناة تجريبية</button>
      <button value="cancel" class="ghost">إغلاق</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
